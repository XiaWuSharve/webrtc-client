[versions]
agp = "9.2.1"
#android = "144.7559.08"
appcompat = "1.7.1"
coreKtx = "1.10.1"
easypermissions = "3.0.0"
googleWebrtc = "1.0.32006"
googleWebrtcVersion = "1.0.45036"
javaWebrtcSdpParser = "0.3.2"
